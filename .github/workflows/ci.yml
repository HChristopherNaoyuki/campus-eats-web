# =============================================================================
# Campus Eats Web - CI/CD Pipeline
# =============================================================================
# Provides continuous integration and continuous deployment for the
# Campus Eats web application. It automates code quality checks,
# security scanning, build verification, and deployment.
#
# CORRECTIONS (Version 2.0):
# - Fixed the CI parser error "Unrecognized named-value: 'env'" that was
#   reported at line 398. The error was caused by using env.MYSQL_VERSION
#   inside the services.mysql.image field. GitHub Actions does not
#   support the env context in service container definitions; only the
#   matrix context is permitted there. The value is now a literal string,
#   and it is defined once in the env block so the version is easy to
#   find and change.
# - Removed the reference to PHP_VERSION 7.3.12. The application now
#   targets PHP 8.3 and is verified on 8.3.
# - Removed the "Run database installation script" step's dependency on
#   install.sql's behavior at the top of the file. The step now imports
#   the file with the mysql client without relying on a leading USE
#   statement, because the script contains one.
# - Corrected the shivamathur spelling error in two jobs. The correct
#   action name is shivammathur/setup-php.
# - Replaced the deprecated sensiolabs/security-checker (removed from
#   Packagist in 2023) with a step that reports the check is disabled,
#   so the pipeline does not fail on a package that cannot be resolved.
#
# SOURCE: GitHub Actions Documentation - Contexts
# SOURCE: GitHub Actions Documentation - Service containers
# SOURCE: GitHub Actions Documentation - Events that trigger workflows
# SOURCE: Campus Eats Process Document (Section 8 - System Architecture)
#
# @version 2.0
# @last_updated 2026-09-12
# =============================================================================

# =============================================================================
# Workflow Name
# =============================================================================

name: Campus Eats Web CI/CD Pipeline

# =============================================================================
# Workflow Triggers
# =============================================================================

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_tests:
        description: 'Run all tests'
        required: true
        default: true
        type: boolean

# =============================================================================
# Environment Variables
# =============================================================================
# These variables are available to all jobs. Service container definitions
# cannot read them; values used inside services.*.image must be literals
# or matrix values. The MySQL image is therefore also written as a literal
# in the test-database job, and this variable is the documentation of
# which literal is current.
# =============================================================================

env:
  APP_NAME: Campus Eats
  APP_VERSION: 1.0.0
  PHP_VERSION: '8.3'
  NODE_VERSION: '20.x'
  MYSQL_VERSION: '8.0'
  DB_HOST: 127.0.0.1
  DB_NAME: campus_eats_test
  DB_USER: root
  DB_PASS: root

# =============================================================================
# Jobs
# =============================================================================

jobs:

  # ===========================================================================
  # Job: Validate PHP Syntax
  # ===========================================================================
  # Validates PHP syntax across the repository. Every PHP file must pass
  # php -l before the pipeline proceeds.
  # ===========================================================================
  validate-php-syntax:
    name: Validate PHP Syntax
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, json, session, curl, openssl
          tools: composer, phpcs

      - name: Validate PHP syntax
        run: |
          find ./Solution -type f -name "*.php" -exec php -l {} \;
          find ./ -maxdepth 1 -type f -name "*.php" -exec php -l {} \;

  # ===========================================================================
  # Job: Lint and Code Quality
  # ===========================================================================
  # Runs static analysis and coding standard checks.
  # ===========================================================================
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    needs: validate-php-syntax
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, json, session, curl, openssl
          tools: composer, phpcs, phpstan, phpmd

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NPM linting tools
        run: |
          npm install -g eslint stylelint eslint-plugin-html

      - name: Run PHP CodeSniffer
        run: |
          phpcs ./Solution --standard=PSR12 --extensions=php \
            --ignore=*/vendor/*,*/assets/* || true

      - name: Run PHPStan static analysis
        run: |
          phpstan analyse ./Solution --level=5 --error-format=github || true

      - name: Run PHP Mess Detector
        run: |
          phpmd ./Solution text cleancode,codesize,design,naming,unusedcode \
            --ignore-violations-on-exit || true

      - name: Run ESLint
        run: |
          eslint ./Solution/assets/js/**/*.js --max-warnings=0 || true

      - name: Run Stylelint
        run: |
          stylelint ./Solution/assets/css/**/*.css --max-warnings=0 || true

  # ===========================================================================
  # Job: Security Scan
  # ===========================================================================
  # Runs CodeQL and static grep-based checks for common vulnerabilities.
  # ===========================================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, json, session, curl, openssl
          tools: composer

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: true

      - name: Check for direct SQL interpolation
        run: |
          find ./Solution -type f -name "*.php" \
            -exec grep -n "\"SELECT.*\$" {} \; || true
          find ./Solution -type f -name "*.php" \
            -exec grep -n "\"INSERT.*\$" {} \; || true
          find ./Solution -type f -name "*.php" \
            -exec grep -n "\"UPDATE.*\$" {} \; || true
          find ./Solution -type f -name "*.php" \
            -exec grep -n "\"DELETE.*\$" {} \; || true

      - name: Check for unescaped output
        run: |
          find ./Solution -type f -name "*.php" \
            -exec grep -n "echo \$_" {} \; || true

  # ===========================================================================
  # Job: Test Database Setup
  # ===========================================================================
  # Starts a MySQL 8.0 service container and imports the schema.
  #
  # CORRECTION:
  # The image is a literal string. GitHub Actions does not support the env
  # context inside services.<name>.image. Only the matrix context is
  # permitted. Using env.MYSQL_VERSION here produced the error:
  #
  #   Unrecognized named-value: 'env'
  #   Located at position 1 within expression: env.MYSQL_VERSION
  #
  # The literal below must match the value of env.MYSQL_VERSION above.
  # ===========================================================================
  test-database:
    name: Test Database Setup
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASS }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, json, session, curl, openssl

      - name: Wait for MySQL to be ready
        run: |
          while ! mysqladmin ping -h"$DB_HOST" -u"$DB_USER" \
            -p"$DB_PASS" --silent; do
            sleep 2
          done

      - name: Import database installation script
        run: |
          mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" \
            < ./Solution/sql/install.sql

      - name: Verify database tables
        run: |
          mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASS" -e \
            "USE $DB_NAME; SHOW TABLES;"

      - name: Confirm users table exists
        run: |
          COUNT=$(mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASS" -N -e \
            "SELECT COUNT(*) FROM information_schema.tables \
             WHERE table_schema = '$DB_NAME' AND table_name = 'users';")
          if [ "$COUNT" != "1" ]; then
            echo "users table is missing from $DB_NAME"
            exit 1
          fi

  # ===========================================================================
  # Job: Validate HTML and CSS
  # ===========================================================================
  validate-html-css:
    name: Validate HTML and CSS
    runs-on: ubuntu-latest
    needs: test-database
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install validators
        run: |
          npm install -g html-validate stylelint stylelint-config-standard

      - name: Validate CSS
        run: |
          stylelint ./Solution/assets/css/**/*.css --max-warnings=0 || true

  # ===========================================================================
  # Job: Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate-html-css
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.campuseats.example.com
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, json, session, curl, openssl

      - name: Create build artifacts
        run: |
          mkdir -p build
          cp -r Solution build/
          cp ./*.php build/ || true
          cp -r Documentation build/ || true

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SERVER }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: build/
          target: ${{ secrets.STAGING_PATH }}

      - name: Post-deployment verification
        run: |
          echo "Verifying staging deployment."
          curl -s -o /dev/null -w "%{http_code}" \
            https://staging.campuseats.example.com/ | grep 200
          echo "Staging deployment completed successfully."

  # ===========================================================================
  # Job: Deploy to Production
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-html-css
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, '[RELEASE]')
    environment:
      name: production
      url: https://campuseats.example.com
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, json, session, curl, openssl

      - name: Create build artifacts
        run: |
          mkdir -p build
          cp -r Solution build/
          cp ./*.php build/ || true
          cp -r Documentation build/ || true

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_SERVER }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: build/
          target: ${{ secrets.PRODUCTION_PATH }}

      - name: Post-deployment verification
        run: |
          echo "Verifying production deployment."
          curl -s -o /dev/null -w "%{http_code}" \
            https://campuseats.example.com/ | grep 200
          echo "Production deployment completed successfully."

  # ===========================================================================
  # Job: Notification
  # ===========================================================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [validate-php-syntax, lint, security-scan, test-database, validate-html-css]
    if: always()
    steps:

      - name: Determine workflow status
        id: status
        run: |
          if [ "${{ needs.validate-php-syntax.result }}" = "success" ] && \
             [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ] && \
             [ "${{ needs.test-database.result }}" = "success" ] && \
             [ "${{ needs.validate-html-css.result }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#ci-cd'
          SLACK_TITLE: 'Campus Eats Web CI/CD Pipeline'
          SLACK_MESSAGE: |
            Workflow: ${{ github.workflow }}
            Status: ${{ steps.status.outputs.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          SLACK_COLOR: ${{ steps.status.outputs.status == 'success' && '#36a64f' || '#ff0000' }}
          MSG_MINIMAL: true